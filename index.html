<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LA OMUT">
<title>LA OMUT · Цех</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EEE6; --card:#FFFDF9; --ink:#211C17; --muted:#857A6E; --line:#E6DDD1; --soft:#EDE5DA;
  --accent:#A8482A; --accent-2:#C9673F; --accent-soft:#F3DED3; --ok:#2E7A57; --warn:#B7791F; --danger:#B3261E;
  --radius:18px; --shadow:0 1px 2px rgba(33,28,23,.04),0 6px 20px rgba(33,28,23,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171411;--card:#211D19;--ink:#F3ECE4;--muted:#A3978A;--line:#352F29;--soft:#2A251F;
    --accent:#E07A4F;--accent-2:#E8906A;--accent-soft:#3A2A22;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
body{min-height:100dvh;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.num{font-family:var(--display);font-feature-settings:"tnum";letter-spacing:-.01em}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- Login ---------- */
.login{flex:1;display:flex;flex-direction:column;padding:calc(28px + var(--safe-t)) 22px calc(22px + var(--safe-b))}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:8px}
.stitch{height:2px;margin:22px 0 24px;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 18px);opacity:.55;border-radius:2px}
.label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;transition:all .15s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:8px 13px;font-size:14px}
.pin-wrap{margin-top:auto;padding-top:26px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 20px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:all .15s}
.dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:64px;border-radius:18px;background:var(--card);font-size:24px;font-weight:600;box-shadow:var(--shadow);transition:transform .08s}
.key:active{transform:scale(.95);background:var(--soft)}
.key.ghost{background:transparent;box-shadow:none;font-size:15px;color:var(--muted)}
.demo-note{margin-top:16px;font-size:13px;text-align:center;color:var(--muted)}

/* ---------- Shell ---------- */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(14px + var(--safe-t)) 18px 10px;display:flex;align-items:center;gap:10px}
.top .hello{flex:1;min-width:0}
.top .hello b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .hello span{font-size:13px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.icon-btn svg{width:20px;height:20px}
.sync{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.main{flex:1;padding:4px 16px calc(96px + var(--safe-b))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:center}
.tabs-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:12px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
.tab.on svg{transform:translateY(-1px)}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--bg) 25%,transparent)}
.hero .k{font-size:12.5px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.hero .v{font-size:32px;font-weight:600;margin-top:6px}
.hero .s{font-size:13.5px;opacity:.75;margin-top:4px}
.section{margin-top:20px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.gap8{gap:8px}
.period{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.period b{font-weight:700}
.period button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.period button:active{background:var(--soft)}
.search{position:relative}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:var(--card);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow);min-height:88px;display:flex;flex-direction:column;justify-content:space-between;border:1.5px solid transparent;transition:transform .08s,border-color .15s;position:relative}
.item:active{transform:scale(.97)}
.item .n{font-weight:700;font-size:15px;line-height:1.25}
.item .p{font-size:13.5px;color:var(--muted);margin-top:6px;font-weight:600}
.item.in{border-color:var(--accent)}
.item .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 7px}
.list{display:flex;flex-direction:column}
.day{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 4px 8px;display:flex;justify-content:space-between}
.entry{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.entry:first-child{border-radius:16px 16px 0 0}.entry:last-child{border-radius:0 0 16px 16px;border-bottom:0}.entry:only-child{border-radius:16px}
.entry .q{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.entry .t{flex:1;min-width:0}
.entry .t b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .t span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .sum{font-weight:700;white-space:nowrap}
.entry.pending{opacity:.65}
.del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.del:active{background:var(--soft);color:var(--danger)}
.del svg{width:18px;height:18px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e{font-size:38px;margin-bottom:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;width:100%;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{height:42px;font-size:14px;border-radius:12px;width:auto;padding:0 16px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.datepick{flex:1.15;position:relative;display:grid;place-items:center;padding:10px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.datepick.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:calc(70px + var(--safe-b));z-index:9;padding:0 14px;display:flex;justify-content:center;pointer-events:none}
.cartbar .in{pointer-events:auto;width:100%;max-width:532px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s ease-out}
.cartbar .in .t{flex:1;font-size:14px}
.cartbar .in .t b{display:block;font-size:17px;font-weight:600}
.cartbar .btn{width:auto;padding:0 18px;height:46px}
@keyframes up{from{transform:translateY(20px);opacity:0}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:20;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(100%)}}
.sheet .in{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--safe-b));max-height:88dvh;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0 14px}
.stepper button{width:62px;height:62px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:30px;font-weight:600}
.stepper button:active{transform:scale(.94)}
.stepper input{width:120px;text-align:center;font-family:var(--display);font-size:44px;font-weight:600;border:0;background:transparent;padding:0}
.quick{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .25s;max-width:92vw;text-align:center}
.toast.err{background:var(--danger);color:#fff}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}

/* admin */
.who{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-bottom:1px solid var(--line);text-align:left;width:100%}
.who:first-child{border-radius:16px 16px 0 0}.who:last-child{border-radius:0 0 16px 16px;border-bottom:0}.who:only-child{border-radius:16px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.who .t{flex:1;min-width:0}
.who .t b{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.edit-row{display:grid;grid-template-columns:1fr 96px 44px;gap:8px;align-items:center;margin-bottom:8px}
.edit-row.staff{grid-template-columns:1fr 78px 92px 44px}
.edit-row input,.edit-row select{padding:10px 11px;border-radius:12px;font-size:15px}
.toggle{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.toggle.on{background:var(--accent-soft);color:var(--ok)}
.toggle svg{width:20px;height:20px}
.off-row{opacity:.5}
.menu{position:absolute;right:16px;top:calc(62px + var(--safe-t));background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:30;min-width:200px}
.menu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;font-weight:600}
.menu button:active{background:var(--soft)}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.help{font-size:13px;color:var(--muted);margin:6px 4px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>

<script>
/* ================== НАСТРОЙКИ ================== */
const CONFIG = {
  // Вставьте сюда ссылку веб-приложения Apps Script (заканчивается на /exec).
  // Пока пусто — приложение работает в демо-режиме на тестовых данных.
  API_URL: 'https://script.google.com/macros/s/AKfycbyN4t9p40Da-z-m6DIizGh_pEuu9mNkj28r8FB5fJpUeLYneIdAPoMFla_PpIK2SDCT/exec',
  CURRENCY: '₸',
  PERIOD: 'half',        // 'half' — 1–15 и 16–конец месяца; 'month' — целый месяц
  STAFF_DELETE_DAYS: 2,  // должно совпадать с Code.gs
};

/* ================== УТИЛИТЫ ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('ru-RU').format(Math.round(n || 0)) + ' ' + CONFIG.CURRENCY;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const store = {
  get(k, d) { try { const v = localStorage.getItem('laomut:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('laomut:' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('laomut:' + k); } catch {} },
};
const COLORS = ['#A8482A','#2E7A57','#3D5A98','#8A5A9E','#B7791F','#2B7F8C','#A23B5E','#5E6B2E'];
const colorFor = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };

function periodOf(dateIso) {
  const d = parse(dateIso), y = d.getFullYear(), m = d.getMonth();
  const last = new Date(y, m + 1, 0).getDate();
  if (CONFIG.PERIOD === 'month') return { from: iso(new Date(y, m, 1)), to: iso(new Date(y, m, last)) };
  return d.getDate() <= 15
    ? { from: iso(new Date(y, m, 1)), to: iso(new Date(y, m, 15)) }
    : { from: iso(new Date(y, m, 16)), to: iso(new Date(y, m, last)) };
}
function shiftPeriod(p, dir) {
  const d = parse(dir < 0 ? p.from : p.to); d.setDate(d.getDate() + dir); return periodOf(iso(d));
}
function periodLabel(p) {
  const a = parse(p.from), b = parse(p.to);
  return `${a.getDate()}–${b.getDate()} ${MONTHS[b.getMonth()]}${b.getFullYear() !== new Date().getFullYear() ? ' ' + b.getFullYear() : ''}`;
}
function dayLabel(s) {
  if (s === today()) return 'Сегодня';
  if (s === yesterday()) return 'Вчера';
  const d = parse(s); return `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

const I = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.5 3.5 5.2"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  left: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>',
};

/* ================== ДЕМО-СЕРВЕР ================== */
const Demo = (() => {
  const PRICE = [['Футболки / лонгсливы',1200],['Свитшоты',1400],['Рубашка',2100],['Рубашка лонг',2600],['Китель',2400],['Китель фулл лонг',2600],['Брюки',1400],['Брюки бум',1700],['Фартук цельный',1600],['Фартук две лопасти',1650],['Крепление крест-накрест',1800],['Фартук поясной мини',1150],['Фартук поясной ту-ван-лонг',1200],['Жилет',2400],['Куверты',400],['Шоппер с дном',550],['Шоппер',500],['Рубашка флис',2300],['Джемпер флис',2400]];
  const STAFF = ['Динара','Антонина','Фариза','Юи','Малика'];
  function seed() {
    const db = {
      price: PRICE.map(([name, price]) => ({ name, price, active: true })),
      staff: STAFF.map(name => ({ name, pin: '1111', role: 'staff', active: true })).concat([{ name: 'Руководитель', pin: '0000', role: 'admin', active: true }]),
      entries: [],
    };
    const orders = ['Vanilla','Мойдадыр','Кофейня Зерно','Ресторан Арка','Отель Сапфир'];
    for (let i = 0; i < 26; i++) {
      const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 18));
      const p = PRICE[Math.floor(Math.random() * PRICE.length)];
      const qty = 1 + Math.floor(Math.random() * 8);
      db.entries.push({ id: uid(), date: iso(d), who: STAFF[i % STAFF.length], item: p[0], qty, price: p[1], sum: qty * p[1], order: orders[(i * 3 + Math.floor(i / 5)) % orders.length], created: new Date(d.getTime() - i * 6e5).toISOString().slice(0, 19), by: STAFF[i % STAFF.length] });
    }
    return db;
  }
  let db = store.get('demo-db') || seed();
  const save = () => store.set('demo-db', db);
  const wait = () => new Promise(r => setTimeout(r, 250));
  async function handle(action, req) {
    await wait();
    if (action === 'staff') return { ok: true, staff: db.staff.filter(s => s.active).map(({ name, role }) => ({ name, role })) };
    const user = db.staff.find(s => s.active && s.name === req.name && s.pin === String(req.pin));
    if (!user) throw new ApiError('Неверный PIN');
    const admin = user.role === 'admin';
    switch (action) {
      case 'init': {
        const seen = new Set(), orders = [];
        [...db.entries].reverse().forEach(e => { const o = (e.order || '').trim(); if (o && !seen.has(o.toLowerCase())) { seen.add(o.toLowerCase()); orders.push(o); } });
        return { ok: true, user: { name: user.name, role: user.role }, price: db.price.filter(p => admin || p.active), staff: admin ? db.staff : db.staff.filter(s => s.active).map(({ name, role }) => ({ name, role })), orders };
      }
      case 'entries': {
        const who = admin ? (req.who || '') : user.name;
        return { ok: true, entries: db.entries.filter(e => (!req.from || e.date >= req.from) && (!req.to || e.date <= req.to) && (!who || e.who === who)).sort((a, b) => (b.date + b.created).localeCompare(a.date + a.created)) };
      }
      case 'add': {
        const added = [];
        for (const it of req.items) {
          if (db.entries.some(e => e.id === it.id)) continue;
          const p = db.price.find(x => x.name === it.item && x.active);
          if (!p) throw new ApiError('Нет в прайсе: ' + it.item);
          const who = admin && it.who ? it.who : user.name;
          const e = { id: it.id, date: it.date, who, item: it.item, qty: +it.qty, price: p.price, sum: p.price * it.qty, order: it.order || '', created: new Date().toISOString().slice(0, 19), by: user.name };
          db.entries.push(e); added.push(e);
        }
        save(); return { ok: true, added };
      }
      case 'delete': {
        const e = db.entries.find(x => x.id === req.id);
        if (!e) throw new ApiError('Запись не найдена');
        if (!admin && e.who !== user.name) throw new ApiError('Можно удалять только свои записи');
        db.entries = db.entries.filter(x => x.id !== req.id); save(); return { ok: true };
      }
      case 'savePrice': if (!admin) throw new ApiError('Нет доступа'); db.price = req.price; save(); return { ok: true, price: db.price };
      case 'saveStaff': if (!admin) throw new ApiError('Нет доступа');
        if (req.staff.some(s => !/^\d{4}$/.test(s.pin))) throw new ApiError('PIN должен быть из 4 цифр');
        if (!req.staff.some(s => s.role === 'admin' && s.active)) throw new ApiError('Должен остаться хотя бы один активный руководитель');
        db.staff = req.staff; save(); return { ok: true, staff: db.staff };
    }
    throw new ApiError('Неизвестное действие');
  }
  return { handle, reset() { db = seed(); save(); } };
})();

/* ================== API ================== */
class ApiError extends Error {}
const DEMO = !CONFIG.API_URL;

async function api(action, data = {}) {
  const body = { action, name: S.user?.name ?? data.name, pin: S.pin ?? data.pin, ...data };
  if (DEMO) return Demo.handle(action, body);
  const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
  let j;
  try { j = await res.json(); } catch { throw new ApiError('Сервер ответил с ошибкой — проверьте ссылку API и доступ «Все»'); }
  if (!j.ok) throw new ApiError(j.error || 'Ошибка');
  return j;
}

function itemsGrid() {

  return `<div class="grid" style="margin-top:10px">${items.map(p => `<button class="item ${inCart[p.name] ? 'in' : ''}" data-act="item" data-v="${esc(p.name)}">

const priceOf = name => (S.price.find(p => p.name === name) || {}).price || 0;

function viewCartBar() {
  const sum = S.cart.reduce((a, c) => a + c.qty * priceOf(c.item), 0);
  const n = S.cart.length;
  return `<div class="cartbar"><div class="in">
    <button class="t" data-act="cart" style="text-align:left;color:inherit"><span>${n} ${plural(n, 'позиция', 'позиции', 'позиций')} · изменить</span><b class="num">${fmt(sum)}</b></button>
    <button class="btn" data-act="send">Отправить</button>
  </div></div>`;

function groupByDay(list) {
  const g = new Map();
  list.forEach(e => { if (!g.has(e.date)) g.set(e.date, []); g.get(e.date).push(e); });
  return [...g.entries()];
}

function canDelete(e) {
  if (isAdmin()) return true;
  if (e.who !== S.user.name) return false;
  const c = Date.parse(e.created); return !c || Date.now() - c < CONFIG.STAFF_DELETE_DAYS * 864e5;
}

function entryRow(e, pending) {
  const sub = [isAdmin() ? e.who : '', e.order, `${fmt(e.price)} × ${e.qty}`].filter(Boolean).map(esc).join(' · ');
  return `<div class="entry ${pending ? 'pending' : ''}">
    <div class="q num">${e.qty}</div>
    <div class="t"><b>${esc(e.item)}</b><span>${pending ? '⏳ ждёт отправки · ' : ''}${sub}</span></div>
    <div class="sum num">${fmt(e.sum)}</div>
    ${pending ? `<button class="del" data-act="unqueue" data-v="${e.id}" aria-label="Убрать">${I.x}</button>`
      : canDelete(e) ? `<button class="del" data-act="del" data-v="${e.id}" aria-label="Удалить">${I.x}</button>` : ''}
  </div>`;
}

    .map(x => ({ ...x, who: x.who || S.user.name, price: priceOf(x.item), sum: priceOf(x.item) * x.qty }));
  const sum = list.reduce((a, e) => a + e.sum, 0) + pending.reduce((a, e) => a + e.sum, 0);
  const qty = list.reduce((a, e) => a + e.qty, 0) + pending.reduce((a, e) => a + e.qty, 0);
  const days = groupByDay(list);
  return `${periodBar()}
    ${isAdmin() ? `<div class="chips" style="margin-top:12px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px">
      <button class="chip sm ${!S.filter ? 'on' : ''}" data-act="filter" data-v="">Все</button>

      <div class="s">${qty} ${plural(qty, 'изделие', 'изделия', 'изделий')} · ${list.length + pending.length} ${plural(list.length + pending.length, 'запись', 'записи', 'записей')}</div>

    ${pending.length ? `<div class="day"><span>Ждут отправки</span></div><div class="list">${pending.map(e => entryRow(e, true)).join('')}</div>` : ''}
    ${days.map(([d, es]) => `<div class="day"><span>${dayLabel(d)}</span><span>${fmt(es.reduce((a, e) => a + e.sum, 0))}</span></div>
      <div class="list">${es.map(e => entryRow(e)).join('')}</div>`).join('')}

}

function viewSummary() {
  if (!S.entries) return periodBar() + '<div class="spinner"></div>';
  const by = {};
  S.staff.filter(s => s.role !== 'admin').forEach(s => by[s.name] = { sum: 0, qty: 0, n: 0, active: s.active });
  S.entries.forEach(e => { const b = by[e.who] || (by[e.who] = { sum: 0, qty: 0, n: 0 }); b.sum += e.sum; b.qty += e.qty; b.n++; });
  const rows = Object.entries(by).filter(([, b]) => b.n || b.active !== false).sort((a, b) => b[1].sum - a[1].sum);
  const total = rows.reduce((a, [, b]) => a + b.sum, 0);
  const qty = rows.reduce((a, [, b]) => a + b.qty, 0);
  const max = Math.max(1, ...rows.map(([, b]) => b.sum));
  const items = {};
  S.entries.forEach(e => items[e.item] = (items[e.item] || 0) + e.qty);
  const top = Object.entries(items).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `${periodBar()}
    <div class="hero" style="margin-top:12px">
      <div class="k">К выплате за период</div>
      <div class="v num">${fmt(total)}</div>
      <div class="s">${qty} ${plural(qty, 'изделие', 'изделия', 'изделий')} · ${rows.filter(r => r[1].n).length} из ${rows.length} швей</div>
    </div>
    <div class="section"><div class="label">По швеям</div>
      <div class="list">${rows.map(([name, b]) => `<button class="who" data-act="open-who" data-v="${esc(name)}">
        <span class="ava" style="background:${colorFor(name)}">${esc(name[0] || '?')}</span>
        <span class="t"><span class="row between"><b>${esc(name)}</b><b class="num">${fmt(b.sum)}</b></span>
          <span class="muted" style="font-size:13px">${b.qty} ${plural(b.qty, 'изделие', 'изделия', 'изделий')} · ${b.n} ${plural(b.n, 'запись', 'записи', 'записей')}</span>
          <span class="bar"><i style="width:${(b.sum / max * 100).toFixed(1)}%"></i></span></span>
      </button>`).join('')}</div>
    </div>
    ${top.length ? `<div class="section"><div class="label">Чаще всего шили</div>
      <div class="card">${top.map(([n, q]) => `<div class="row between" style="padding:6px 0"><span>${esc(n)}</span><b class="num">${q}</b></div>`).join('')}</div></div>` : ''}
    <div class="section row gap8">
      <button class="btn ghost" data-act="csv">Скачать таблицу (CSV)</button>
    </div>`;
}

let sheetState = null;
function openSheet(html) { $('#layer').innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet"><div class="in"><div class="grab"></div>${html}</div></div>`; }
function closeSheet() { $('#layer').innerHTML = ''; sheetState = null; }

function openItem(name) {
  const existing = S.cart.find(c => c.item === name);
  sheetState = { item: name, qty: existing ? existing.qty : 1 };
  drawItemSheet();
}
function drawItemSheet() {
  const s = sheetState, p = priceOf(s.item);
  openSheet(`<h3>${esc(s.item)}</h3><div class="muted">${fmt(p)} за штуку</div>
    <div class="stepper">
      <button data-act="qty" data-v="-1">−</button>
      <input class="num" id="qty" value="${s.qty}" inputmode="numeric" data-in="qty">
      <button data-act="qty" data-v="1">+</button>
    </div>
    <div class="quick">${[5, 10, 20, 50].map(n => `<button class="chip sm" data-act="qtyset" data-v="${n}">${n}</button>`).join('')}</div>
    <button class="btn" data-act="tocart" id="tocart">${S.cart.some(c => c.item === s.item) ? 'Обновить' : 'Добавить'} · <span class="num">${fmt(p * s.qty)}</span></button>
    ${S.cart.some(c => c.item === s.item) ? '<button class="btn ghost" style="margin-top:8px" data-act="fromcart">Убрать из списка</button>' : ''}`);
}
function openCart() {
  const sum = S.cart.reduce((a, c) => a + c.qty * priceOf(c.item), 0);
  openSheet(`<h3>Проверьте перед отправкой</h3>
    <div class="muted" style="margin-top:4px">${dayLabel(S.date)}${S.order ? ' · ' + esc(S.order) : ''}${isAdmin() && S.forWho ? ' · ' + esc(S.forWho) : ''}</div>
    <div class="list" style="margin:16px 0">${S.cart.map((c, i) => `<div class="entry">
      <div class="q num">${c.qty}</div><div class="t"><b>${esc(c.item)}</b><span>${fmt(priceOf(c.item))} × ${c.qty}</span></div>
      <div class="sum num">${fmt(priceOf(c.item) * c.qty)}</div>
      <button class="del" data-act="cartdel" data-v="${i}">${I.x}</button></div>`).join('')}</div>
    <div class="row between" style="margin:0 4px 16px"><b>Итого</b><b class="num" style="font-size:20px">${fmt(sum)}</b></div>
    <button class="btn" data-act="send">Отправить</button>`);
}

/* ---------- Уведомления ---------- */
let toastTimer;
function toast(msg, err) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
  if (navigator.vibrate) navigator.vibrate(err ? [30, 40, 30] : 15);
}

/* ================== ДЕЙСТВИЯ ================== */
async function loadNames() {
  try { const r = await api('staff'); S.login.names = r.staff; store.set('names', r.staff); }
  catch { S.login.names = store.get('names', []); if (!S.login.names.length) toast('Нет связи с сервером', true); }
  if (!S.login.names.some(n => n.name === S.login.name)) S.login.name = '';
  if (!S.user) render();
}

async function tryLogin() {
  const { name, pin } = S.login;
  try {
    const r = await api('init', { name, pin });
    S.pin = pin; S.user = r.user; S.price = r.price; S.staff = r.staff; S.orders = r.orders || [];
    store.set('session', { name, pin }); store.set('lastName', name);
    store.set('cache', { user: r.user, price: r.price, staff: r.staff, orders: S.orders });
    S.tab = isAdmin() ? 'summary' : 'add';
    S.login.pin = '';
    render(); loadEntries(); flushQueue();
  } catch (e) {
    S.login.pin = ''; render();
    $('#dots')?.classList.add('shake');
    toast(e instanceof ApiError ? e.message : 'Нет связи с сервером', true);
  }
}

async function restore() {
  const sess = store.get('session'), cache = store.get('cache');
  if (!sess) { render(); loadNames(); return; }
  S.pin = sess.pin;
  if (cache) { Object.assign(S, { user: cache.user, price: cache.price, staff: cache.staff, orders: cache.orders || [] }); S.tab = isAdmin() ? 'summary' : 'add'; render(); }
  try {
    const r = await api('init', { name: sess.name, pin: sess.pin });
    Object.assign(S, { user: r.user, price: r.price, staff: r.staff, orders: r.orders || [] });
    store.set('cache', { user: r.user, price: r.price, staff: r.staff, orders: S.orders });
    if (!cache) S.tab = isAdmin() ? 'summary' : 'add';
    render(); loadEntries(); flushQueue();
  } catch (e) {
    if (e instanceof ApiError) { logout(); toast(e.message, true); }
    else if (!cache) { render(); loadNames(); }
    else { toast('Нет интернета — показаны сохранённые данные', true); S.entries = store.get(entriesKey(), null); render(); }
  }
}

function logout() {
  store.del('session'); store.del('cache');
  Object.assign(S, { user: null, pin: null, entries: null, cart: [], menu: false, editPrice: null, editStaff: null, filter: '', forWho: '' });
  S.login.pin = ''; render(); loadNames();
}

let loadSeq = 0;
const entriesKey = () => 'entries:' + (S.user?.name || '') + ':' + S.period.from;
async function loadEntries() {
  const seq = ++loadSeq, key = entriesKey();
  S.entries = store.get(key, null); render();
  try {
    const r = await api('entries', { from: S.period.from, to: S.period.to });
    if (seq !== loadSeq) return;
    S.entries = r.entries; store.set(key, r.entries); render();
  } catch (e) {
    if (seq !== loadSeq) return;
    if (!S.entries) S.entries = [];
    render(); toast(e instanceof ApiError ? e.message : 'Нет интернета — показаны сохранённые данные', true);
  }
}

let sending = false;
async function sendCart() {
  if (sending || !S.cart.length) return;
  if (isAdmin() && !S.forWho) { closeSheet(); toast('Выберите, за кого вносите', true); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const items = S.cart.map(c => ({ id: uid(), date: S.date, item: c.item, qty: c.qty, order: S.order.trim(), who: isAdmin() ? S.forWho : '' }));
  sending = true;
  try {
    const r = await api('add', { items });
    S.cart = []; closeSheet();
    if (S.order.trim() && !S.orders.includes(S.order.trim())) S.orders.unshift(S.order.trim());
    const sum = r.added.reduce((a, e) => a + e.sum, 0);
    toast(`Записано: ${fmt(sum)} ✓`);
    if (S.entries && r.added.length) {
      const inP = r.added.filter(e => e.date >= S.period.from && e.date <= S.period.to);
      S.entries = [...inP, ...S.entries];
    }
    render();
  } catch (e) {
    if (e instanceof ApiError) { toast(e.message, true); }
    else {
      S.queue.push(...items.map(x => ({ ...x, owner: S.user.name }))); store.set('queue', S.queue);
      S.cart = []; closeSheet(); render();
      toast('Нет интернета — сохранено, отправим позже');
    }
  } finally { sending = false; }
}

let flushing = false;
const myQueue = () => S.queue.filter(x => x.owner === S.user?.name);
async function flushQueue() {
  if (flushing || !S.user || !myQueue().length) return;
  flushing = true;
  try {
    const batch = myQueue().slice(0, 50).map(({ owner, ...x }) => x);
    if (!batch.length) return;
    await api('add', { items: batch });
    const ids = new Set(batch.map(b => b.id));
    S.queue = S.queue.filter(x => !ids.has(x.id)); store.set('queue', S.queue);
    toast('Отложенные записи отправлены ✓');
    loadEntries();
  } catch (e) {
    if (e instanceof ApiError) toast('Не удалось отправить отложенные: ' + e.message, true);
  } finally { flushing = false; }
}

function askDelete(id) {
  const e = S.entries.find(x => x.id === id);
  if (!e) return;
  openSheet(`<h3>Удалить запись?</h3>
    <div class="muted" style="margin:6px 0 18px">${esc(e.item)} × ${e.qty}${isAdmin() ? ' · ' + esc(e.who) : ''} · ${dayLabel(e.date)} · ${fmt(e.sum)}</div>
    <button class="btn" style="background:var(--danger)" data-act="del-yes" data-v="${esc(id)}">Удалить</button>
    <button class="btn ghost" style="margin-top:8px" data-act="close">Отмена</button>`);
}
async function deleteEntry(id) {
  closeSheet();
  try { await api('delete', { id }); S.entries = S.entries.filter(x => x.id !== id); render(); toast('Удалено'); }
  catch (err) { toast(err instanceof ApiError ? err.message : 'Нет связи', true); }
}

function downloadCsv() {
  const rows = [['Дата', 'Сотрудник', 'Изделие', 'Кол-во', 'Цена', 'Сумма', 'Заказ']];
  [...S.entries].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => rows.push([e.date, e.who, e.item, e.qty, e.price, e.sum, e.order]));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `zarplata_${S.period.from}_${S.period.to}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- События ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (S.menu && (!el || el.dataset.act !== 'menu')) { S.menu = false; render(); if (!el) return; }
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case 'pick': S.login.name = v; S.login.pin = ''; render(); break;
    case 'key':
      if (v === 'back') S.login.pin = S.login.pin.slice(0, -1);
      else if (S.login.pin.length < 4) S.login.pin += v;
      render();
      if (S.login.pin.length === 4) tryLogin();
      break;
    case 'menu': S.menu = !S.menu; render(); break;
    case 'logout': logout(); break;
    case 'reload': S.menu = false; restore(); break;
    case 'demo-reset': Demo.reset(); S.menu = false; restore(); toast('Демо-данные сброшены'); break;
    case 'tab':
      if (S.tab === v) { window.scrollTo({ top: 0, behavior: 'smooth' }); break; }
      S.tab = v; S.editPrice = null; S.editStaff = null; window.scrollTo(0, 0); render(); break;
    case 'period': S.period = shiftPeriod(S.period, +v); loadEntries(); break;
    case 'date': S.date = v; render(); break;
    case 'forwho': S.forWho = S.forWho === v ? '' : v; render(); break;
    case 'item': openItem(v); break;
    case 'qty': sheetState.qty = Math.max(1, Math.min(1000, (sheetState.qty || 0) + +v)); drawItemSheet(); break;
    case 'qtyset': sheetState.qty = +v; drawItemSheet(); break;
    case 'tocart': {
      const i = S.cart.findIndex(c => c.item === sheetState.item);
      if (i >= 0) S.cart[i].qty = sheetState.qty; else S.cart.push({ item: sheetState.item, qty: sheetState.qty });
      closeSheet(); render(); break;
    }
    case 'fromcart': S.cart = S.cart.filter(c => c.item !== sheetState.item); closeSheet(); render(); break;
    case 'cart': openCart(); break;
    case 'cartdel': S.cart.splice(+v, 1); if (S.cart.length) openCart(); else closeSheet(); render(); break;
    case 'send': sendCart(); break;
    case 'close': closeSheet(); break;
    case 'del': askDelete(v); break;
    case 'del-yes': deleteEntry(v); break;
    case 'unqueue': S.queue = S.queue.filter(x => x.id !== v); store.set('queue', S.queue); render(); break;
    case 'filter': S.filter = v; render(); break;
    case 'open-who': S.filter = v; S.tab = 'entries'; window.scrollTo(0, 0); render(); break;
    case 'csv': downloadCsv(); break;
    case 'ptoggle': S.editPrice[+v].active = S.editPrice[+v].active === false; render(); break;
    case 'padd': S.editPrice.push({ name: '', price: 0, active: true }); render(); document.querySelectorAll('[data-in=pname]').forEach((x, i, a) => i === a.length - 1 && x.focus()); break;
    case 'psave': {
      const list = S.editPrice.filter(p => p.name.trim()).map(p => ({ name: p.name.trim(), price: Number(String(p.price).replace(/\s/g, '').replace(',', '.')) || 0, active: p.active !== false }));
      try { const r = await api('savePrice', { price: list }); S.price = r.price; S.editPrice = null; render(); toast('Прайс сохранён ✓'); }
      catch (e) { toast(e instanceof ApiError ? e.message : 'Нет связи', true); }
      break;
    }
    case 'stoggle': S.editStaff[+v].active = S.editStaff[+v].active === false; render(); break;
    case 'sadd': S.editStaff.push({ name: '', pin: String(Math.floor(1000 + Math.random() * 9000)), role: 'staff', active: true }); render(); document.querySelectorAll('[data-in=sname]').forEach((x, i, a) => i === a.length - 1 && x.focus()); break;
    case 'ssave': {
      const list = S.editStaff.filter(s => s.name.trim()).map(s => ({ ...s, name: s.name.trim(), pin: String(s.pin).trim() }));
      try {
        const r = await api('saveStaff', { staff: list }); S.staff = r.staff; S.editStaff = null;
        const me = r.staff.find(s => s.name === S.user.name);
        if (!me || !me.active || me.role !== 'admin') { toast('Ваш доступ изменён — войдите снова'); logout(); break; }
        if (me.pin !== S.pin) { S.pin = me.pin; store.set('session', { name: me.name, pin: me.pin }); }
        render(); toast('Команда сохранена ✓');
      } catch (e) { toast(e instanceof ApiError ? e.message : 'Нет связи', true); }
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset.in, i = +el.dataset.i;
  if (!k) return;
  if (k === 'q') { S.q = el.value; $('#grid').innerHTML = itemsGrid(); }
  else if (k === 'order') S.order = el.value;
  else if (k === 'date') { if (el.value) { S.date = el.value > today() ? today() : el.value; render(); } }
  else if (k === 'qty') { const n = parseInt(el.value.replace(/\D/g, ''), 10); sheetState.qty = Math.max(1, Math.min(1000, n || 1)); const b = $('#tocart'); if (b) b.innerHTML = `${S.cart.some(c => c.item === sheetState.item) ? 'Обновить' : 'Добавить'} · <span class="num">${fmt(priceOf(sheetState.item) * sheetState.qty)}</span>`; }
  else if (k === 'pname') S.editPrice[i].name = el.value;
  else if (k === 'pprice') S.editPrice[i].price = el.value;
  else if (k === 'sname') S.editStaff[i].name = el.value;
  else if (k === 'spin') S.editStaff[i].pin = el.value.replace(/\D/g, '').slice(0, 4);
  else if (k === 'srole') S.editStaff[i].role = el.value;
});
document.addEventListener('change', ev => { if (ev.target.dataset.in === 'srole') S.editStaff[+ev.target.dataset.i].role = ev.target.value; });
document.addEventListener('focusin', ev => { if (ev.target.id === 'qty') ev.target.select(); });

window.addEventListener('online', flushQueue);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user) { flushQueue(); if (S.tab !== 'price' && S.tab !== 'team') loadEntries(); } });

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:' && !DEMO_SANDBOX()) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
function DEMO_SANDBOX() { try { return window.self !== window.top; } catch { return true; } }

restore();
</script>
</body>
</html>
